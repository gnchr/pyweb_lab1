name: Deploy to Helios

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helios-production
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.HELIOS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: helios
    env:
      HELIOS_HOST: ${{ vars.HELIOS_HOST }}
      HELIOS_PORT: ${{ vars.HELIOS_PORT }}
      HELIOS_DEPLOY_PATH: ${{ vars.HELIOS_DEPLOY_PATH }}
      HELIOS_SITE_URL: ${{ vars.HELIOS_SITE_URL }}
      HELIOS_USER: ${{ secrets.HELIOS_USER }}
      HELIOS_SSH_KEY: ${{ secrets.HELIOS_SSH_KEY }}
      HELIOS_KNOWN_HOSTS: ${{ secrets.HELIOS_KNOWN_HOSTS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip

      - name: Validate deployment configuration
        run: python scripts/deploy_helios.py --validate-only

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Build site for Helios
        env:
          SITE_URL: ${{ env.HELIOS_SITE_URL }}
        run: python -m mkdocs build --strict

      - name: Check generated site
        run: python scripts/smoke_test.py --directory site

      - name: Configure SSH
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$HELIOS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HELIOS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy site with rsync
        run: python scripts/deploy_helios.py

      - name: Check published site
        run: python scripts/smoke_test.py --url "$HELIOS_SITE_URL"

