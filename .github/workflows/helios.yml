name: Publish to Helios

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      target_branch:
        type: string
        required: true
      action:
        type: string
        default: deploy
      automatic:
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: helios-site
  queue: max
  cancel-in-progress: false

jobs:
  deploy:
    # Every caller runs full CI for this exact commit before publication/restoration.
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: helios
      url: ${{ steps.config.outputs.site_url }}
    env:
      HELIOS_HOST: ${{ vars.HELIOS_HOST }}
      HELIOS_PORT: ${{ vars.HELIOS_PORT }}
      HELIOS_DEPLOY_PATH: ${{ vars.HELIOS_DEPLOY_PATH }}
      HELIOS_SITE_URL: ${{ vars.HELIOS_SITE_URL }}
      HELIOS_USER: ${{ secrets.HELIOS_USER }}
      HELIOS_SSH_KEY: ${{ secrets.HELIOS_SSH_KEY }}
      HELIOS_KNOWN_HOSTS: ${{ secrets.HELIOS_KNOWN_HOSTS }}
      MAIN_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
      TARGET_BRANCH: ${{ inputs.target_branch }}
      OPERATION: ${{ inputs.action || 'deploy' }}
    steps:
      - name: Require automatic deployment to be enabled
        if: inputs.automatic
        env:
          HELIOS_ENABLED: ${{ vars.HELIOS_ENABLED }}
        run: |
          if [ "$HELIOS_ENABLED" != "true" ]; then
            echo '::error::HELIOS_ENABLED must be true for the required Helios check.'
            exit 1
          fi

      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python on GitHub runner only
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip

      - name: Reject a superseded branch commit
        uses: actions/github-script@v9
        env:
          EXPECTED_SHA: ${{ inputs.ref }}
        with:
          script: |
            const branch = await github.rest.repos.getBranch({
              ...context.repo, branch: process.env.TARGET_BRANCH
            });
            if (branch.data.commit.sha !== process.env.EXPECTED_SHA) {
              core.setFailed('Branch advanced while CI was running; refusing to publish an outdated commit.');
            }

      - name: Configure deployment or preview
        id: config
        run: python scripts/deploy_helios.py --action configure --branch "$TARGET_BRANCH"

      - name: Install dependencies
        if: env.OPERATION == 'deploy'
        run: python -m pip install --requirement requirements.txt

      - name: Build site for Helios
        if: env.OPERATION == 'deploy'
        env:
          SITE_URL: ${{ steps.config.outputs.site_url }}
        run: python -m mkdocs build --strict

      - name: Check generated site
        if: env.OPERATION == 'deploy'
        run: python scripts/smoke_test.py --directory site

      - name: Stamp release
        if: env.OPERATION == 'deploy'
        env:
          RELEASE_ID: ${{ steps.config.outputs.release }}
        run: python scripts/stamp_release.py --release "$RELEASE_ID" --branch "$TARGET_BRANCH"

      - name: Configure SSH
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$HELIOS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HELIOS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Start delivery measurement
        run: python scripts/deployment_metrics.py start --file _build/helios-delivery.json

      - name: Deploy, rollback or recover
        id: publish
        env:
          RELEASE_ID: ${{ steps.config.outputs.release }}
        run: python scripts/deploy_helios.py --action "$OPERATION" --branch "$TARGET_BRANCH" --metrics-file _build/helios-publish.json

      - name: Check published site
        id: health
        env:
          PUBLISHED_URL: ${{ steps.config.outputs.site_url }}
          EXPECTED_MARKER: ${{ steps.publish.outputs.marker }}
        run: python scripts/smoke_test.py --url "$PUBLISHED_URL" --expected-marker "$EXPECTED_MARKER" --metrics-file _build/helios-health.json

      - name: Restore previous version after failed healthcheck
        id: restore
        if: failure() && steps.health.outcome == 'failure' && steps.publish.outputs.has_previous == 'true'
        env:
          FAILED_RELEASE: ${{ steps.publish.outputs.release }}
        run: python scripts/deploy_helios.py --action rollback --branch "$TARGET_BRANCH" --expect-release "$FAILED_RELEASE"

      - name: Check restored version
        if: always() && steps.restore.outcome == 'success'
        env:
          PUBLISHED_URL: ${{ steps.config.outputs.site_url }}
          EXPECTED_MARKER: ${{ steps.restore.outputs.marker }}
        run: python scripts/smoke_test.py --url "$PUBLISHED_URL" --expected-marker "$EXPECTED_MARKER"

      - name: Finish delivery measurement
        if: always()
        env:
          PUBLISHED_URL: ${{ steps.config.outputs.site_url }}
          OUTCOME: ${{ steps.publish.outcome }}/${{ steps.health.outcome }}
        run: python scripts/deployment_metrics.py finish --file _build/helios-delivery.json --url "$PUBLISHED_URL" --outcome "$OUTCOME"

      - name: Save deployment measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helios-measurements-${{ github.run_id }}-${{ github.run_attempt }}
          path: _build/helios-*.json

      - name: Show deployment URL in summary and pull request
        uses: actions/github-script@v9
        env:
          PUBLISHED_URL: ${{ steps.config.outputs.site_url }}
          DEPLOYED_SHA: ${{ inputs.ref }}
          RELEASE_ID: ${{ steps.publish.outputs.release }}
        with:
          script: |
            const report = require('./scripts/publish_preview.cjs');
            await report.reportDeployment({github, context, core, env: process.env});

