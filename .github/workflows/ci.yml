name: CI

# One run per pushed commit. Its checks are visible in the associated PR too.
on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: CI
    uses: ./.github/workflows/ci-build.yml
    with:
      ref: ${{ github.sha }}

  deploy:
    name: Deploy to Helios
    needs: build
    uses: ./.github/workflows/helios.yml
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    secrets: inherit
    with:
      ref: ${{ github.sha }}
      target_branch: ${{ github.ref_name }}
      action: deploy

