name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Build site in strict mode
        env:
          SITE_URL: http://127.0.0.1:8000/
        run: python -m mkdocs build --strict

      - name: Check generated site
        run: python scripts/smoke_test.py --directory site

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Check search in both subdirectory layouts
        run: python scripts/browser_test.py --directory site

