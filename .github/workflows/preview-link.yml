name: Show existing Helios preview

# Metadata-only notification: no second CI build and no deployment.
on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read
  deployments: read
  pull-requests: write

# Serialize with deployment reporting so PR-open and deploy cannot create duplicates.
concurrency:
  group: helios-site
  queue: max
  cancel-in-progress: false

jobs:
  link:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Find successful deployment for this PR head
        uses: actions/github-script@v9
        env:
          BASE_SITE_URL: ${{ vars.HELIOS_SITE_URL }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const sha = pr.head.sha;
            const branch = pr.head.ref;
            if (!process.env.BASE_SITE_URL) return;
            const base = process.env.BASE_SITE_URL.replace(/\/*$/, '/');
            const slug = branch.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'branch';
            const hash = require('node:crypto').createHash('sha256').update(branch).digest('hex').slice(0, 12);
            const expected = branch === context.payload.repository.default_branch ? base : `${base}previews/${slug}-${hash}/`;
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              ...context.repo, sha, environment: 'helios', per_page: 100
            });
            let published;
            for (const deployment of deployments) {
              const statuses = await github.paginate(github.rest.repos.listDeploymentStatuses, {
                ...context.repo, deployment_id: deployment.id, per_page: 100
              });
              published = statuses.find(s => s.state === 'success' && s.environment_url === expected);
              if (published) break;
            }
            if (!published) return; // The running deployment will post its own comment when it finishes.
            const current = (await github.rest.pulls.get({...context.repo, pull_number: pr.number})).data;
            if (current.state !== 'open' || current.head.sha !== sha) return;
            const marker = '<!-- pyweb-lab1-helios-preview -->';
            const body = `${marker}\n### Preview на Helios\n\n[Открыть preview](${expected})\n\n` +
              'Для этой ветки найдено успешное развёртывание на Helios. ' +
              'Следующий деплой или откат может изменить содержимое ссылки.';
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: pr.number, per_page: 100
            });
            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.startsWith(marker));
            // Keep a more detailed deployment comment if one was posted in the meantime.
            if (!existing) await github.rest.issues.createComment({...context.repo, issue_number: pr.number, body});
