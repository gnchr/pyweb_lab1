name: Wait for successful push CI

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      branch:
        type: string
        required: true
      pull_number:
        type: number
        required: true
      merged:
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  wait:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact target commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Wait for CI / build of this commit
        uses: actions/github-script@v9
        env:
          EXPECTED_SHA: ${{ inputs.ref }}
          TARGET_BRANCH: ${{ inputs.branch }}
          PULL_NUMBER: ${{ inputs.pull_number }}
          REQUIRE_MERGED: ${{ inputs.merged }}
        with:
          script: |
            const {waitForCI} = require('./scripts/wait_for_ci.cjs');
            await waitForCI({github, context, core, env: process.env});
