name: Deploy to GitHub Pages

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    # production.yml runs full CI first and calls this workflow in main context.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      ref: ${{ inputs.ref }}
      marker: ${{ steps.release.outputs.marker }}
      delivery_started: ${{ steps.measurement.outputs.delivery_started }}
    steps:
      - name: Require main workflow context
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [ "$WORKFLOW_REF" != "refs/heads/main" ]; then
            echo '::error::GitHub Pages requires main workflow context, not a PR merge ref.'
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Reject a superseded main commit
        uses: actions/github-script@v9
        env:
          EXPECTED_SHA: ${{ inputs.ref }}
        with:
          script: |
            const branch = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            if (branch.data.commit.sha !== process.env.EXPECTED_SHA) {
              core.setFailed('Main advanced while CI was running; refusing to publish an outdated commit.');
            }

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site in strict mode
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
        run: python -m mkdocs build --strict

      - name: Check generated site
        run: python scripts/smoke_test.py --directory site

      - name: Stamp release
        id: release
        env:
          RELEASE_ID: ${{ inputs.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python scripts/stamp_release.py --release "$RELEASE_ID"
          echo "marker=PYWEB_LAB1_RELEASE:$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Start delivery measurement before artifact transfer
        id: measurement
        run: python scripts/deployment_metrics.py start --file _build/pages-delivery.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.ref }}

      - name: Reject a superseded main commit before publication
        uses: actions/github-script@v9
        env:
          EXPECTED_SHA: ${{ needs.build.outputs.ref }}
        with:
          script: |
            const branch = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            if (branch.data.commit.sha !== process.env.EXPECTED_SHA) {
              core.setFailed('Main advanced during the Pages build; refusing to publish an outdated commit.');
            }

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Start delivery measurement
        env:
          DELIVERY_STARTED: ${{ needs.build.outputs.delivery_started }}
        run: python scripts/deployment_metrics.py start --file _build/pages-delivery.json --started-at "$DELIVERY_STARTED"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Check published site
        id: health
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_MARKER: ${{ needs.build.outputs.marker }}
        run: python scripts/smoke_test.py --url "$DEPLOYED_URL" --expected-marker "$EXPECTED_MARKER" --metrics-file _build/pages-health.json

      - name: Finish delivery measurement
        if: always()
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
          OUTCOME: ${{ steps.deployment.outcome }}/${{ steps.health.outcome }}
        run: python scripts/deployment_metrics.py finish --file _build/pages-delivery.json --url "$DEPLOYED_URL" --outcome "$OUTCOME"

      - name: Save deployment measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-measurements-${{ github.run_id }}-${{ github.run_attempt }}
          path: _build/pages-*.json

