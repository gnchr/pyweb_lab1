name: Deploy Helios preview

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  ci:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref != 'main'
    name: CI
    uses: ./.github/workflows/ci-build.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}

  deploy:
    name: Publish Helios preview
    needs: ci
    uses: ./.github/workflows/helios.yml
    secrets: inherit
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      target_branch: ${{ github.event.pull_request.head.ref }}
      action: deploy

  result:
    # GitHub accepts skipped required jobs. Report failure explicitly if CI/deploy was skipped.
    name: Preview ready
    if: always()
    needs: [ci, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful CI and preview healthcheck
        env:
          CI_RESULT: ${{ needs.ci.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          if [ "$CI_RESULT" != "success" ] || [ "$DEPLOY_RESULT" != "success" ]; then
            echo '::error::Preview requires successful CI and successful Helios deployment/healthcheck.'
            exit 1
          fi
