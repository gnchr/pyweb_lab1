name: Deploy merged main

on:
  # repository_dispatch runs on the default branch (main), never refs/pull/*/merge.
  repository_dispatch:
    types: [main-merged]

permissions:
  contents: read
  deployments: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci-build.yml
    with:
      ref: ${{ github.event.client_payload.sha }}
      require_merged_main: true
      merge_pr_number: ${{ github.event.client_payload.pull_number }}

  helios:
    name: Deploy to Helios
    needs: ci
    uses: ./.github/workflows/helios.yml
    secrets: inherit
    with:
      ref: ${{ github.event.client_payload.sha }}
      target_branch: main
      action: deploy

  pages:
    name: Deploy to GitHub Pages
    needs: ci
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ github.event.client_payload.sha }}
