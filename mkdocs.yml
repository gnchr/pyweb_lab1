site_name: Веб-программирование
site_description: Учебный справочник по HTML, CSS, JavaScript, HTTP и Python
site_url: !ENV [SITE_URL, "http://127.0.0.1:8000/"]
repo_url: https://github.com/gnchr/pyweb_lab1
repo_name: gnchr/pyweb_lab1
edit_uri: ""

docs_dir: docs
site_dir: site
use_directory_urls: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

theme:
  name: material
  language: ru
  font: false
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Переключить на тёмную тему
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Переключить на светлую тему
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.footer
    - content.code.copy

plugins:
  - search:
      lang:
        - ru
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

nav:
  - Главная: index.md
  - HTML и CSS: frontend.md
  - JavaScript: javascript.md
  - HTTP: http.md
  - Python на сервере: python.md
  - Практикум: practice.md

copyright: >-
  Код — MIT; содержимое сайта — CC BY 4.0

